name: tmp lock regen
on:
  push:
    branches: [chore/core-v0.87.0]
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      - run: git diff --stat pubspec.lock
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git diff --cached --quiet || git commit -m "chore: pubspec.lock を flutter pub get で再生成 (core v0.87.0)"
          git push
